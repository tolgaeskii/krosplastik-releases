<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KrosPlastik — Uygulamayı İndir</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #1e3a5f;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .platform {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .platform-title {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .platform-note {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-android {
      background: #1e3a5f;
      color: white;
    }
    .btn-ios {
      background: #000;
      color: white;
    }
    .btn-testflight {
      background: #0071e3;
      color: white;
    }
    .btn-disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      pointer-events: none;
    }
    .footer {
      margin-top: 32px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Kros Plastik</div>
    <div class="subtitle">Enjeksiyon San. ve Tic. Ltd. Şti. — Manisa</div>

    <h1>Uygulamayı İndir</h1>
    <p class="desc">Kurumsal operasyon yönetim uygulaması.<br>Görev takibi, ürün kataloğu ve daha fazlası.</p>

    <!-- Android -->
    <div class="platform">
      <div class="platform-title">Android</div>
      <div class="platform-note">Android 6.0 ve üzeri</div>
      <a class="btn btn-android"
         href="https://github.com/tolgaeskii/krosplastik-releases/releases/latest/download/KrosPlastik.apk">
        APK İndir
      </a>
    </div>

    <!-- iOS -->
    <div class="platform">
      <div class="platform-title">iOS (iPhone)</div>
      <div class="platform-note">iOS 13.0 ve üzeri</div>
      <!-- App Store linki gelince btn-ios ile değiştir -->
      <a class="btn btn-disabled" href="#">App Store — Yakında</a>
    </div>

    <div class="footer">
      Sadece yetkili kullanıcılar içindir.
    </div>
  </div>
</body>
</html>
